name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ "main" ] # Altere para 'master' se a sua branch principal for essa

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: true # CORRIGIDO: Era 'cancel-in-running'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Garante que o código seja baixado

      - name: Setup Pages
        uses: actions/configure-pages@v4 # Configura o ambiente do Pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Prepara o pacote para deploy
        with:
          # IMPORTANTE: Aponta para a pasta onde seu index.html está
          path: './frontend' 

      - name: Deployment
        id: deployment # Adicionado ID para referenciar a URL
        uses: actions/deploy-pages@v4 # Executa o deploy propriamente dito